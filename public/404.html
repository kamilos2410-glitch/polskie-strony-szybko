<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Strona nie znaleziona (404) — SCS Web</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #0a0a0a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 32rem;
      border: 1px solid #3a3a3a;
      background: #0f0f0f;
      padding: 2.5rem;
    }

    .code {
      font-size: clamp(4rem, 14vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: #ffffff;
      margin: 0;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 1.25rem 0 0.75rem;
      color: #ffffff;
    }

    p {
      color: #b8b8b8;
      margin: 0 0 1.5rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.75rem 1.25rem;
      border: 1px solid #3a3a3a;
      background: #0a0a0a;
      color: #f5f5f5;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      background: #1a1a1a;
      border-color: #666666;
    }

    .btn-primary {
      background: #ffffff;
      color: #0a0a0a;
      border-color: #ffffff;
    }

    .btn-primary:hover {
      background: #e5e5e5;
      border-color: #e5e5e5;
    }

    .contact {
      border-top: 1px solid #333333;
      padding-top: 1.25rem;
      color: #b8b8b8;
      font-size: 0.95rem;
    }

    .contact a {
      color: #ffffff;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }

    .contact a:hover {
      color: #b8b8b8;
    }

    @media (max-width: 480px) {
      .card {
        padding: 1.75rem;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="code" aria-hidden="true">404</p>
    <h1>Nie znaleźliśmy tej strony</h1>
    <p>Adres jest nieprawidłowy albo strona została przeniesiona.</p>

    <div class="actions">
      <a href="/" class="btn btn-primary">Strona główna</a>
      <a href="/uslugi/strona-internetowa" class="btn">Oferta i cennik</a>
      <a href="/kalkulator" class="btn">Kalkulator wyceny</a>
    </div>

    <div class="contact">
      Masz pytanie? Zadzwoń:
      <a href="tel:+48664013998">+48 664 013 998</a>
      lub napisz:
      <a href="mailto:kamil@scsweb.pl">kamil@scsweb.pl</a>
    </div>
  </main>
</body>
</html>
